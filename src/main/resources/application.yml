spring:
  application:
    name: ledger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

ledger:
  outbox:
    drain-fixed-delay-ms: 100
    batch-size: 50
    max-attempts: 5
    backoff-base-ms: 200
    backoff-cap-ms: 30000
    sink: in-process
    webhook-url: ${OUTBOX_WEBHOOK_URL:}
    worker-count: 1
