name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    # No postgres service container here: the integration tests use
    # Testcontainers, which spins up its own Postgres via the runner's
    # Docker daemon (available by default on ubuntu-latest) and wires the
    # dynamic port itself — see IntegrationTestBase.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t ledger-service:${{ github.sha }} .
